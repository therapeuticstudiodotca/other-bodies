<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Other Bodies — Erosion</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,400;0,500;0,600;1,400&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --paper: #ffffff;
  --panel: #faf9f8;
  --ink: #5d5a5b;
  --ink-strong: #454344;
  --stone: #a29f9f;
  --hair: #e6e4e2;
  --hair-soft: #efedeb;
  --ease: cubic-bezier(.22,.61,.36,1);
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Asap', system-ui, -apple-system, 'Segoe UI', sans-serif;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  line-height: 1.6;
}

/* ── TITLE SCREEN ─────────────────────────────────────────────── */
#title-screen {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--paper);
  gap: 1.6rem;
  transition: opacity 1.5s ease;
}

#title-screen.hidden {
  opacity: 0;
  pointer-events: none;
}

.story-title {
  font-size: clamp(30px, 4.6vw, 52px);
  font-weight: 500;
  font-style: normal;
  color: var(--ink-strong);
  letter-spacing: -0.015em;
  line-height: 1.07;
  text-align: center;
}

.story-nature {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.2em;
  color: var(--stone);
  text-transform: uppercase;
  text-align: center;
}

.begin-options {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.7rem;
  opacity: 0;
  animation: fadeIn 2s ease 1.2s forwards;
}

.begin-btn {
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--ink);
  text-transform: uppercase;
  background: var(--paper);
  border: 1px solid var(--hair);
  border-radius: 100px;
  cursor: pointer;
  padding: 0.6rem 1.4rem;
  transition: border-color .2s var(--ease), color .2s var(--ease), background .2s var(--ease);
}

.begin-btn:hover {
  border-color: var(--stone);
  color: var(--ink-strong);
  background: var(--panel);
}

.begin-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.begin-btn.secondary {
  font-size: 10.5px;
  border-color: transparent;
  background: none;
  color: var(--stone);
  letter-spacing: 0.16em;
}

.begin-btn.secondary:hover {
  border-color: transparent;
  background: none;
  color: var(--ink);
}

/* ── AUTOPLAY INDICATOR ───────────────────────────────────────── */
.autoplay-indicator {
  position: fixed;
  top: 50%;
  right: 2rem;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
  opacity: 0;
  transition: opacity 1s ease;
  pointer-events: all;
  z-index: 20;
}

.autoplay-indicator.visible { opacity: 1; }

.autoplay-pulse {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--stone);
  animation: pulse 2s ease infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50%      { opacity: 1;   transform: scale(1.5); }
}

.autoplay-progress {
  width: 1px;
  background: var(--hair);
  position: relative;
  overflow: hidden;
}

.autoplay-progress-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--stone);
  transition: height 0.1s linear;
}

.autoplay-label {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.16em;
  color: var(--stone);
  writing-mode: vertical-rl;
  text-transform: uppercase;
  cursor: pointer;
  transition: color .2s var(--ease);
}

.autoplay-label:hover { color: var(--ink); }

/* ── CANVAS ───────────────────────────────────────────────────── */
canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  cursor: grab;
}
canvas:active { cursor: grabbing; }

/* ── HEADER ───────────────────────────────────────────────────── */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 10;
  padding: 26px 28px 18px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 28px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1.5s ease;
}

header.visible { opacity: 1; }

.title-block { display: flex; flex-direction: column; gap: 0.35rem; }

.constellation-label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.2em;
  color: var(--stone);
  text-transform: uppercase;
}

.emotion-name {
  font-size: clamp(26px, 3.8vw, 44px);
  font-weight: 400;
  font-style: italic;
  color: var(--ink-strong);
  line-height: 1.07;
  letter-spacing: -0.015em;
  transition: opacity 0.8s ease;
}

.attribution {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--stone);
  text-align: right;
  line-height: 1.9;
}

/* ── FOOTER ───────────────────────────────────────────────────── */
footer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 22px 28px 26px;
  pointer-events: none;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 2rem;
  opacity: 0;
  transition: opacity 1.5s ease;
}

footer.visible { opacity: 1; }

.phrase-block {
  max-width: 40ch;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}

.story-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.16em;
  color: var(--stone);
  text-transform: uppercase;
}

.phrase {
  font-size: 17px;
  font-weight: 400;
  font-style: italic;
  line-height: 1.6;
  color: var(--ink);
  transition: opacity 1.2s ease;
}

.phrase.hidden { opacity: 0; }

/* ── PROGRESS DOTS ────────────────────────────────────────────── */
.progress-dots {
  display: flex;
  gap: 0.45rem;
  align-items: center;
}

.dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--hair);
  transition: background 0.8s ease, transform 0.4s ease;
}

.dot.active {
  background: var(--ink-strong);
  transform: scale(1.35);
}

.dot.done { background: var(--stone); }

/* ── PARAM BLOCK ──────────────────────────────────────────────── */
.param-block {
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.1em;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.4rem;
}

.param-row { display: flex; align-items: center; gap: 0.6rem; }
.param-name { color: var(--stone); min-width: 7.5em; text-align: right; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; font-size: 9.5px; }
.param-bar { width: 52px; height: 1px; background: var(--hair); position: relative; }
.param-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--stone); transition: width 3s ease; }
.param-val { min-width: 2.6em; color: var(--ink); }

/* ── NAV ──────────────────────────────────────────────────────── */
.nav {
  position: fixed;
  bottom: 26px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 0.5rem;
  z-index: 20;
  opacity: 0;
  transition: opacity 1.5s ease;
  pointer-events: none;
}

.nav.visible { opacity: 1; pointer-events: all; }

.nav-btn {
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--hair);
  border-radius: 100px;
  cursor: pointer;
  text-transform: uppercase;
  transition: border-color .2s var(--ease), color .2s var(--ease), background .2s var(--ease);
  padding: 0.5rem 1.1rem;
}

.nav-btn:hover:not(:disabled) { border-color: var(--stone); color: var(--ink-strong); background: var(--panel); }
.nav-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.nav-btn:disabled { opacity: 0.35; cursor: default; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

@media (max-width: 720px) {
  header { padding: 18px 18px 12px; }
  footer { padding: 16px 18px 20px; flex-direction: column; align-items: flex-start; gap: 1.2rem; }
  .param-block { align-items: flex-start; }
  .param-name { text-align: left; }
  .attribution { line-height: 1.7; }
  .autoplay-indicator { right: 1rem; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

// ██████ ENGINE
// ═══════════════════════════════════════════════════════════════════════════

// ── RENDERER ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0xffffff, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.fog = new THREE.FogExp2(0xffffff, 0.012);

// Paper reference + soft round sprite, so points read as ink on paper.
const PAPER = new THREE.Color(0xffffff);
const DOT_TEX = (() => {
  const s = 64, cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  grd.addColorStop(0,    'rgba(255,255,255,1)');
  grd.addColorStop(0.42, 'rgba(255,255,255,0.9)');
  grd.addColorStop(1,    'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, s, s);
  return new THREE.CanvasTexture(cv);
})();

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);

// ── NOISE ──────────────────────────────────────────────────────────────────
function hash(n) { return ((Math.sin(n * 127.1) * 43758.5453) % 1 + 1) % 1; }
function noise3(x, y, z) {
  const ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z);
  const fx=x-ix,fy=y-iy,fz=z-iz;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy),uz=fz*fz*(3-2*fz);
  const h=(a,b,c)=>hash(a+b*57+c*113);
  return h(ix,iy,iz)*(1-ux)*(1-uy)*(1-uz)+h(ix+1,iy,iz)*ux*(1-uy)*(1-uz)
        +h(ix,iy+1,iz)*(1-ux)*uy*(1-uz)+h(ix+1,iy+1,iz)*ux*uy*(1-uz)
        +h(ix,iy,iz+1)*(1-ux)*(1-uy)*uz+h(ix+1,iy,iz+1)*ux*(1-uy)*uz
        +h(ix,iy+1,iz+1)*(1-ux)*uy*uz+h(ix+1,iy+1,iz+1)*ux*uy*uz;
}
function fbm(x,y,z,oct=5){
  let v=0,a=0.5,f=1,m=0;
  for(let i=0;i<oct;i++){v+=noise3(x*f,y*f,z*f)*a;m+=a;a*=0.5;f*=2.1;}
  return v/m;
}

// ── CLOUD GENERATION ──────────────────────────────────────────────────────
const TOTAL_POINTS = 14000;

function generateCloud(p) {
  const {intensity,texture,pastDepth,futureUncertainty,permeability,waterPresence} = p;
  const baseRadius = 3.5 + intensity * 3.5;
  const pointCount = Math.floor(TOTAL_POINTS * (0.4 + intensity * 0.6));
  const positions = new Float32Array(TOTAL_POINTS * 3);
  const pointData = [];
  const col = new THREE.Color();

  for (let i = 0; i < TOTAL_POINTS; i++) {
    // Points beyond pointCount stay in the cloud but nearly paper-pale, so
    // density reads as lightness rather than leaving a clump at the origin.
    const isFiller = i >= pointCount;

    const shellBias = Math.pow(Math.random(), 1/(0.3+permeability*2.5));
    const r = baseRadius * shellBias;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2*Math.random()-1);
    let x = r*Math.sin(phi)*Math.cos(theta);
    let y = r*Math.sin(phi)*Math.sin(theta);
    let z = r*Math.cos(phi);

    const ns=0.18+texture*0.55, ta=texture*baseRadius*0.55;
    x+=(fbm(x*ns+1.3,y*ns+0.7,z*ns+2.1)-0.5)*ta;
    y+=(fbm(x*ns+5.1,y*ns+3.3,z*ns+0.9)-0.5)*ta;
    z+=(fbm(x*ns+0.4,y*ns+8.2,z*ns+4.7)-0.5)*ta;

    const isPast = Math.random() < pastDepth * 0.55;
    if (isPast) {
      const pp = Math.pow(Math.random(),1.5)*pastDepth;
      z -= pp*baseRadius*1.8; x*=(1-pp*0.35); y*=(1-pp*0.35);
    }

    const isFuture = z>0 && Math.random()<futureUncertainty*0.45;
    if (isFuture) {
      const fr = Math.random()*futureUncertainty;
      z+=fr*baseRadius*0.9;
      x+=(Math.random()-0.5)*fr*baseRadius*0.6;
      y+=(Math.random()-0.5)*fr*baseRadius*0.6;
    }

    const wb = waterPresence*0.6;
    const st = Math.round(y/(baseRadius*0.4))*(baseRadius*0.4);
    y = y*(1-wb)+st*wb*(0.5+Math.random()*0.5);

    const dist = Math.sqrt(x*x+y*y+z*z);
    const normR = Math.min(1, dist/(baseRadius*1.6));
    const normY = (y/baseRadius)*0.5+0.5;
    let t = normR;
    if (isPast) t = Math.max(0,t-0.25);
    if (isFuture) t = Math.min(1,t+0.2);
    const band = Math.sin(normY*Math.PI*3.5)*0.055*waterPresence;

    if (t<0.33) col.lerpColors(p.palette.deep, p.palette.mid, t/0.33);
    else if (t<0.66) col.lerpColors(p.palette.mid, p.palette.high, (t-0.33)/0.33);
    else col.lerpColors(p.palette.high, p.palette.peak, (t-0.66)/0.34);
    col.r=Math.max(0,Math.min(1,col.r+band));
    col.b=Math.max(0,Math.min(1,col.b-band*0.5));
    if (isFuture) col.lerpColors(col,p.palette.fringe,Math.random()*0.5);
    if (isFiller) col.lerp(PAPER, 0.88);

    positions[i*3]=x; positions[i*3+1]=y; positions[i*3+2]=z;
    pointData.push({x,y,z,baseR:col.r,baseG:col.g,baseB:col.b,isPast,isFuture,activation:0,neighbors:[]});
  }
  return {positions, pointData, baseRadius, pointCount};
}

// ── NEIGHBOUR GRAPH ────────────────────────────────────────────────────────
function buildNeighbourGraph(pointData, baseRadius, permeability, pointCount) {
  const stride=8, signalNodes=[];
  for (let i=0; i<pointCount; i+=stride) signalNodes.push(i);
  const connR = baseRadius*(0.28+permeability*0.22);
  signalNodes.forEach(i=>{
    const pi=pointData[i]; pi.neighbors=[];
    signalNodes.forEach(j=>{
      if (i===j) return;
      const pj=pointData[j];
      const dx=pi.x-pj.x, dy=pi.y-pj.y, dz=pi.z-pj.z;
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if (d<connR) pi.neighbors.push({idx:j,dist:d,weight:1-d/connR});
    });
    pi.neighbors.sort((a,b)=>b.weight-a.weight);
    pi.neighbors=pi.neighbors.slice(0,6);
  });
  return signalNodes;
}

// ── SIGNAL ─────────────────────────────────────────────────────────────────
class Signal {
  constructor(startIdx, pointData, signalNodes, p) {
    this.idx=startIdx; this.pointData=pointData;
    this.signalNodes=signalNodes; this.p=p;
    this.progress=0; this.nextIdx=null; this.alive=true; this.age=0;
    const baseLife=4+(1-p.signalVariability)*8;
    this.maxHops=Math.max(2,Math.round(baseLife+(Math.random()-0.5)*p.signalVariability*6));
    this.hops=0;
    this.brightness=Math.max(0.1,p.signalIntensity+(Math.random()-0.5)*p.signalVariability*0.4);
    this.speed=Math.max(0.05,p.signalSpeed+(Math.random()-0.5)*p.signalVariability*0.5);
    this.trail=[];
    this.trailMaxLength=Math.round(8+(1-p.signalVariability)*10);
    this._chooseNext();
  }
  _chooseNext(){
    const cur=this.pointData[this.idx];
    if(!cur.neighbors||cur.neighbors.length===0){this.alive=false;return;}
    const sel=1-this.p.signalVariability*0.8;
    let chosen;
    if(Math.random()<sel){
      const topN=Math.max(1,Math.floor(cur.neighbors.length*(1-this.p.signalVariability*0.6)));
      chosen=cur.neighbors[Math.floor(Math.random()*topN)];
    } else {
      chosen=cur.neighbors[Math.floor(Math.random()*cur.neighbors.length)];
    }
    this.nextIdx=chosen?chosen.idx:null;
    if(!this.nextIdx) this.alive=false;
  }
  update(dt){
    if(!this.alive) return;
    this.age+=dt;
    this.progress+=dt*this.speed*1.8;
    if(this.progress>=1){
      this.progress=0; this.idx=this.nextIdx; this.hops++;
      if(this.hops>=this.maxHops){this.alive=false;return;}
      this.pointData[this.idx].activation=this.brightness;
      const cur=this.pointData[this.idx];
      const bc=Math.min(cur.neighbors.length,5);
      for(let c=0;c<bc;c++){
        if(cur.neighbors[c]){
          const ni=cur.neighbors[c].idx;
          this.pointData[ni].activation=Math.max(this.pointData[ni].activation,this.brightness*(1-c/bc)*0.72);
        }
      }
      if(Math.random()<this.p.signalVariability*0.55){
        const cs=Math.floor(Math.random()*this.p.signalVariability*4);
        for(let c=0;c<cs;c++){
          if(cur.neighbors[c]){
            const ni=cur.neighbors[c].idx;
            this.pointData[ni].activation=Math.max(this.pointData[ni].activation,this.brightness*(0.2+Math.random()*0.3));
          }
        }
      }
      this.trail.forEach(e=>e.strength*=0.88);
      if(this.nextIdx!==null){
        this.trail.unshift({fromIdx:this.idx,toIdx:this.nextIdx,strength:1.0});
        if(this.trail.length>this.trailMaxLength) this.trail.length=this.trailMaxLength;
      }
      this._chooseNext();
    }
  }
}

// ── INTERPOLATION STATE ───────────────────────────────────────────────────
let currentStep = 0;
let transitioning = false;
let transitionProgress = 0;
const TRANSITION_DURATION = 4.0; // seconds

let fromParams = {...STORY.steps[0].params};
let toParams   = {...STORY.steps[0].params};
let liveParams = {...STORY.steps[0].params};

function lerpParams(a, b, t) {
  const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t; // ease in-out quad
  const lerp = (x,y) => x+(y-x)*ease;
  return {
    intensity:         lerp(a.intensity, b.intensity),
    texture:           lerp(a.texture, b.texture),
    pastDepth:         lerp(a.pastDepth, b.pastDepth),
    futureUncertainty: lerp(a.futureUncertainty, b.futureUncertainty),
    permeability:      lerp(a.permeability, b.permeability),
    waterPresence:     lerp(a.waterPresence, b.waterPresence),
    signalSpeed:       lerp(a.signalSpeed, b.signalSpeed),
    signalIntensity:   lerp(a.signalIntensity, b.signalIntensity),
    signalVariability: lerp(a.signalVariability, b.signalVariability),
    palette: {
      deep:   new THREE.Color().lerpColors(a.palette.deep,   b.palette.deep,   ease),
      mid:    new THREE.Color().lerpColors(a.palette.mid,    b.palette.mid,    ease),
      high:   new THREE.Color().lerpColors(a.palette.high,   b.palette.high,   ease),
      peak:   new THREE.Color().lerpColors(a.palette.peak,   b.palette.peak,   ease),
      fringe: new THREE.Color().lerpColors(a.palette.fringe, b.palette.fringe, ease),
      signal: new THREE.Color().lerpColors(a.palette.signal, b.palette.signal, ease),
    }
  };
}

// ── THREE GEOMETRY ────────────────────────────────────────────────────────
const initCloud = generateCloud(liveParams);
let pointData   = initCloud.pointData;
let signalNodes = buildNeighbourGraph(pointData, initCloud.baseRadius, liveParams.permeability, initCloud.pointCount);

const edgeList = [];
signalNodes.forEach(i=>{
  pointData[i].neighbors.forEach(nb=>{
    if(nb.idx>i) edgeList.push({a:i,b:nb.idx});
  });
});

const MAX_CONN  = Math.max(edgeList.length, 8000);
const connPosArr = new Float32Array(MAX_CONN*2*3);
const connColArr = new Float32Array(MAX_CONN*2*3);
const connGeo    = new THREE.BufferGeometry();
connGeo.setAttribute('position', new THREE.BufferAttribute(connPosArr,3));
connGeo.setAttribute('color',    new THREE.BufferAttribute(connColArr,3));
connGeo.setDrawRange(0,0);
const connLines  = new THREE.LineSegments(connGeo, new THREE.LineBasicMaterial({
  vertexColors:true,transparent:true,opacity:0.55,blending:THREE.NormalBlending,depthWrite:false
}));

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(initCloud.positions.slice(),3));
const colArr = new Float32Array(TOTAL_POINTS*3);
geo.setAttribute('color', new THREE.BufferAttribute(colArr,3));
const pts = new THREE.Points(geo, new THREE.PointsMaterial({
  size:0.16, map:DOT_TEX, vertexColors:true, transparent:true, opacity:0.62,
  sizeAttenuation:true, blending:THREE.NormalBlending, depthWrite:false
}));

const MAX_TRAIL  = 1200;
const trailPosArr = new Float32Array(MAX_TRAIL*2*3);
const trailColArr = new Float32Array(MAX_TRAIL*2*3);
const trailGeo    = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPosArr,3));
trailGeo.setAttribute('color',    new THREE.BufferAttribute(trailColArr,3));
trailGeo.setDrawRange(0,0);
const trailLines  = new THREE.LineSegments(trailGeo, new THREE.LineBasicMaterial({
  vertexColors:true,transparent:true,opacity:0.7,blending:THREE.NormalBlending,depthWrite:false
}));

const group = new THREE.Group();
group.add(connLines, pts, trailLines);
scene.add(group);

// Target positions — regenerated when params change significantly
let targetPositions = initCloud.positions.slice();
let currentPositions = initCloud.positions.slice();
let posLerpT = 1.0;

function regeneratePositions(p) {
  const cloud = generateCloud(p);
  pointData   = cloud.pointData;
  signalNodes = buildNeighbourGraph(pointData, cloud.baseRadius, p.permeability, cloud.pointCount);
  return cloud.positions;
}

// ── SIGNALS ───────────────────────────────────────────────────────────────
const signals = [];
let signalTimer = 0;

function spawnSignal(){
  if(!signalNodes.length) return;
  signals.push(new Signal(
    signalNodes[Math.floor(Math.random()*signalNodes.length)],
    pointData, signalNodes, liveParams
  ));
}

function nextSpawnInterval(){
  return Math.max(0.05, 0.8-liveParams.signalSpeed*0.55+(Math.random()-0.5)*liveParams.signalVariability*0.6);
}

let nextSpawn = nextSpawnInterval();
const maxSignals = () => Math.round(5+liveParams.signalSpeed*8+liveParams.signalVariability*5);
for(let i=0;i<5;i++) spawnSignal();

// ── PARAM BARS ────────────────────────────────────────────────────────────
const paramDefs = [
  {key:'intensity',label:'intensity'},{key:'texture',label:'texture'},
  {key:'pastDepth',label:'past'},{key:'futureUncertainty',label:'future'},
  {key:'permeability',label:'permeability'},{key:'waterPresence',label:'water'},
  {key:'signalSpeed',label:'speed'},{key:'signalIntensity',label:'signal'},

// ── PROGRESS DOTS ─────────────────────────────────────────────────────────
const dotsEl = document.getElementById('progress-dots');
STORY.steps.forEach((_,i)=>{

  d.id=`dot-${i}`;

});

function updateDots(){

// ── STEP NAVIGATION ───────────────────────────────────────────────────────
const phraseEl       = document.getElementById('phrase');
const emotionNameEl  = document.getElementById('emotion-name');
const constellationEl= document.getElementById('constellation-label');
const prevBtn        = document.getElementById('prev-btn');
const nextBtn        = document.getElementById('next-btn');

function goToStep(idx){
  if(idx<0||idx>=STORY.steps.length||transitioning) return;

  fromParams = {...liveParams, palette: {...liveParams.palette}};
  toParams   = {...STORY.steps[idx].params};
  transitioning = true;
  transitionProgress = 0;

  // Fade phrase out
  phraseEl.classList.add('hidden');

  // After short delay, update text and fade in
  setTimeout(()=>{
    const step = STORY.steps[idx];
    emotionNameEl.textContent   = step.emotion;
    constellationEl.textContent = step.constellation + ' · Other Bodies';
    phraseEl.textContent        = step.phrase;
    phraseEl.classList.remove('hidden');
  }, 600);

  currentStep = idx;
  updateDots();

  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === STORY.steps.length - 1;

  // Regenerate target cloud
  setTimeout(()=>{
    targetPositions = regeneratePositions(toParams);
    posLerpT = 0;
  }, 800);
}

prevBtn.addEventListener('click', ()=> {
  if (isAutoplay) { autoplayPaused = true; autoplayLabel.textContent = 'paused'; }
  goToStep(currentStep-1);
});
nextBtn.addEventListener('click', ()=> {
  if (isAutoplay) {
    // Manual skip in autoplay — restart dwell on new step
    goToStep(currentStep+1);
    setTimeout(startAutoplayDwell, TRANSITION_DURATION * 1000 + 200);
  } else {
    goToStep(currentStep+1);
  }
});

// ── AUTOPLAY SYSTEM ───────────────────────────────────────────────────────
let isAutoplay = false;
let autoplaying = false;
let autoplayDwellRemaining = 0;
let autoplayDwellTotal = 0;
let autoplayPaused = false;

const autoplayIndicator  = document.getElementById('autoplay-indicator');
const autoplayFill       = document.getElementById('autoplay-progress-fill');
const autoplayTrack      = document.getElementById('autoplay-progress-track');
const autoplayLabel      = document.getElementById('autoplay-label');
const autoplayPulseEl    = document.getElementById('autoplay-pulse');

function getDwell(step) {
  const [min, max] = STORY.steps[step].dwell;
  // Organic variation — not just random, slightly weighted toward the middle
  const r = 0.3 + Math.random() * 0.4 + Math.random() * 0.3;
  return min + (max - min) * r;
}

function startAutoplayDwell() {
  autoplayDwellTotal     = getDwell(currentStep);
  autoplayDwellRemaining = autoplayDwellTotal;
  autoplaying = true;
}

function tickAutoplay(dt) {
  if (!isAutoplay || autoplayPaused || transitioning) return;

  autoplayDwellRemaining -= dt;

  // Progress bar fills from bottom as dwell counts down
  const pct = 1 - Math.max(0, autoplayDwellRemaining / autoplayDwellTotal);
  autoplayFill.style.height = `${pct * 100}%`;

  if (autoplayDwellRemaining <= 0) {
    const next = currentStep + 1;
    if (next < STORY.steps.length) {
      goToStep(next);
      // dwell will restart after transition settles
      setTimeout(startAutoplayDwell, TRANSITION_DURATION * 1000 + 200);
    } else {
      // Story complete — pulse fades, stays on final state
      autoplaying = false;
      autoplayIndicator.classList.remove('visible');
    }
  }
}

autoplayLabel.addEventListener('click', () => {
  autoplayPaused = !autoplayPaused;
  autoplayLabel.textContent = autoplayPaused ? 'paused' : 'autoplay';
  autoplayPulseEl.style.animationPlayState = autoplayPaused ? 'paused' : 'running';
});

// ── TITLE SCREEN ──────────────────────────────────────────────────────────
let started = false;

function startExperience(withAutoplay) {
  if (started) return;
  started   = true;
  isAutoplay = withAutoplay;

  const ts = document.getElementById('title-screen');
  ts.classList.add('hidden');

  setTimeout(() => {
    document.getElementById('header').classList.add('visible');
    document.getElementById('footer').classList.add('visible');
    document.getElementById('nav').classList.add('visible');

    if (isAutoplay) {
      autoplayIndicator.classList.add('visible');
      setTimeout(startAutoplayDwell, 800);
    }
  }, 800);
}

document.getElementById('begin-btn').addEventListener('click', () => startExperience(false));
document.getElementById('autoplay-btn').addEventListener('click', () => startExperience(true));

// ── INTERACTION ───────────────────────────────────────────────────────────
let dragging=false, prev={x:0,y:0};
let rotY=0, rotX=0.05, tRotY=0, tRotX=0.05, zoom=18, tZoom=18;

canvas.addEventListener('mousedown',e=>{dragging=true;prev={x:e.clientX,y:e.clientY};});
canvas.addEventListener('mousemove',e=>{
  if(!dragging)return;
  tRotY+=(e.clientX-prev.x)*0.005;
  tRotX=Math.max(-1,Math.min(1,tRotX+(e.clientY-prev.y)*0.004));
  prev={x:e.clientX,y:e.clientY};
});
canvas.addEventListener('mouseup',()=>dragging=false);
canvas.addEventListener('mouseleave',()=>dragging=false);
canvas.addEventListener('wheel',e=>{tZoom=Math.max(6,Math.min(45,tZoom+e.deltaY*0.02));e.preventDefault();},{passive:false});

let lt=null;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===1){dragging=true;lt={x:e.touches[0].clientX,y:e.touches[0].clientY};}});
canvas.addEventListener('touchmove',e=>{
  if(!dragging||e.touches.length!==1)return;
  tRotY+=(e.touches[0].clientX-lt.x)*0.006;
  tRotX=Math.max(-1,Math.min(1,tRotX+(e.touches[0].clientY-lt.y)*0.004));
  lt={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend',()=>dragging=false);

// ── ANIMATION ─────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let time = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  if(!dragging) tRotY += dt*0.04;
  rotY += (tRotY-rotY)*0.04;
  rotX += (tRotX-rotX)*0.04;
  zoom += (tZoom-zoom)*0.055;
  group.rotation.y = rotY;
  group.rotation.x = rotX*0.35;

  // ── AUTOPLAY TICK ────────────────────────────────────────────────────────
  tickAutoplay(dt);

  // ── TRANSITION ──────────────────────────────────────────────────────────
  if(transitioning){
    transitionProgress = Math.min(1, transitionProgress + dt/TRANSITION_DURATION);
    liveParams = lerpParams(fromParams, toParams, transitionProgress);
    updateParamBars();
    if(transitionProgress >= 1) {
      transitioning = false;
      fromParams = {...toParams, palette: {...toParams.palette}};
    }
  }

  // ── POSITION LERP ───────────────────────────────────────────────────────
  if(posLerpT < 1){
    posLerpT = Math.min(1, posLerpT + dt/TRANSITION_DURATION);
    const ease = posLerpT < 0.5 ? 2*posLerpT*posLerpT : -1+(4-2*posLerpT)*posLerpT;
    for(let i=0;i<TOTAL_POINTS*3;i++){
      currentPositions[i] = currentPositions[i] + (targetPositions[i]-currentPositions[i])*ease*0.06;
    }
  }

  // ── BREATHE ─────────────────────────────────────────────────────────────
  const breathD = 0.016 + liveParams.texture*0.010;
  const pa = geo.attributes.position.array;
  for(let i=0;i<TOTAL_POINTS;i++){
    const ox=currentPositions[i*3], oy=currentPositions[i*3+1], oz=currentPositions[i*3+2];
    const b=Math.sin(i*0.38+time*0.28)*breathD;
    pa[i*3]=ox*(1+b); pa[i*3+1]=oy*(1+b*0.9); pa[i*3+2]=oz*(1+b*0.7);
  }
  geo.attributes.position.needsUpdate=true;

  // ── SIGNALS ─────────────────────────────────────────────────────────────
  signalTimer+=dt;
  if(signalTimer>=nextSpawn && signals.length<maxSignals()){
    spawnSignal(); signalTimer=0; nextSpawn=nextSpawnInterval();
  }
  const decayRate = 0.55+liveParams.signalSpeed*0.6;
  for(let i=0;i<TOTAL_POINTS;i++){
    if(pointData[i] && pointData[i].activation>0)
      pointData[i].activation=Math.max(0,pointData[i].activation-dt*decayRate);
  }
  for(let s=signals.length-1;s>=0;s--){
    signals[s].update(dt);
    if(!signals[s].alive) signals.splice(s,1);
  }

  // ── POINT COLOURS ───────────────────────────────────────────────────────
  const ca  = geo.attributes.color.array;
  const sigC = liveParams.palette.signal;
  for(let i=0;i<TOTAL_POINTS;i++){
    const pd=pointData[i];
    if(!pd){ca[i*3]=ca[i*3+1]=ca[i*3+2]=1;continue;}
    const act=pd.activation;
    if(act>0.001){
      const tint=Math.min(1,act*1.9), deepen=Math.max(0,(act-0.4)*0.5);
      ca[i*3]  =Math.max(0,pd.baseR+(sigC.r-pd.baseR)*tint-deepen);
      ca[i*3+1]=Math.max(0,pd.baseG+(sigC.g-pd.baseG)*tint-deepen);
      ca[i*3+2]=Math.max(0,pd.baseB+(sigC.b-pd.baseB)*tint-deepen*0.85);
    } else {
      ca[i*3]=pd.baseR; ca[i*3+1]=pd.baseG; ca[i*3+2]=pd.baseB;
    }
  }
  geo.attributes.color.needsUpdate=true;

  // ── CONNECTION LINES ─────────────────────────────────────────────────────
  const posA=geo.attributes.position.array;
  let connCount=0;
  for(let e=0;e<edgeList.length&&connCount<MAX_CONN;e++){
    const {a,b}=edgeList[e];
    if(!pointData[a]||!pointData[b]) continue;
    const actA=pointData[a].activation, actB=pointData[b].activation;
    const joint=Math.sqrt(actA*actB);
    if(joint<0.06) continue;
    const base=connCount*6,ai=a*3,bi=b*3;
    connPosArr[base]=posA[ai]; connPosArr[base+1]=posA[ai+1]; connPosArr[base+2]=posA[ai+2];
    connPosArr[base+3]=posA[bi]; connPosArr[base+4]=posA[bi+1]; connPosArr[base+5]=posA[bi+2];
    const bA=Math.max(0.3,Math.min(1,actA*1.5)), bB=Math.max(0.3,Math.min(1,actB*1.5));
    connColArr[base]  =1+(sigC.r-1)*bA; connColArr[base+1]=1+(sigC.g-1)*bA; connColArr[base+2]=1+(sigC.b-1)*bA;
    connColArr[base+3]=1+(sigC.r-1)*bB; connColArr[base+4]=1+(sigC.g-1)*bB; connColArr[base+5]=1+(sigC.b-1)*bB;
    connCount++;
  }
  connGeo.setDrawRange(0,connCount*2);
  connGeo.attributes.position.needsUpdate=true;
  connGeo.attributes.color.needsUpdate=true;

  // ── TRAIL LINES ──────────────────────────────────────────────────────────
  let edgeCount=0;
  for(const sig of signals){
    if(!sig.trail) continue;
    for(let t=0;t<sig.trail.length;t++){
      if(edgeCount>=MAX_TRAIL) break;
      const edge=sig.trail[t];
      const fi=edge.fromIdx*3, ti=edge.toIdx*3;
      const base=edgeCount*6;
      trailPosArr[base]=posA[fi]; trailPosArr[base+1]=posA[fi+1]; trailPosArr[base+2]=posA[fi+2];
      trailPosArr[base+3]=posA[ti]; trailPosArr[base+4]=posA[ti+1]; trailPosArr[base+5]=posA[ti+2];
      const s2=Math.min(1,edge.strength*sig.brightness*1.6);
      const fadePos=t/Math.max(1,sig.trail.length);
      const wp=(1-fadePos)*(1-fadePos);
      const k=Math.max(0.25,Math.min(1,s2*(0.4+wp*0.6)));
      const r=1+(sigC.r-1)*k, g=1+(sigC.g-1)*k, b2=1+(sigC.b-1)*k;
      trailColArr[base]=r; trailColArr[base+1]=g; trailColArr[base+2]=b2;
      trailColArr[base+3]=1+(r-1)*0.5; trailColArr[base+4]=1+(g-1)*0.5; trailColArr[base+5]=1+(b2-1)*0.5;
      edgeCount++;
    }
  }
  trailGeo.setDrawRange(0,edgeCount*2);
  trailGeo.attributes.position.needsUpdate=true;
  trailGeo.attributes.color.needsUpdate=true;

  camera.position.x=Math.sin(rotY)*zoom;
  camera.position.z=Math.cos(rotY)*zoom;
  camera.position.y=rotX*14;
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>
</body>
</html>
